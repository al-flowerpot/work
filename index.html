<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3-Day Workout Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14213d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef1ec;--surface:#fff;--ink:#14213d;--muted:#5d6779;--line:#d5dad2;--accent:#f2b705;--on-accent:#14213d;--done:#2f5d8a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161f;--surface:#19212d;--ink:#eef1ec;--muted:#9aa5b8;--line:#2b3546;--accent:#f2b705;--on-accent:#14213d;--done:#6fa3d6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161f;--surface:#19212d;--ink:#eef1ec;--muted:#9aa5b8;--line:#2b3546;--accent:#f2b705;--on-accent:#14213d;--done:#6fa3d6;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1{font:700 30px/1.1 "Barlow Condensed",Impact,sans-serif;margin:8px 0 14px;letter-spacing:.01em}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.tab{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 4px;font:600 14px/1.2 Barlow,sans-serif;cursor:pointer;text-align:center}
.tab small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] small{color:var(--bg);opacity:.75}
.tab.complete::after{content:" ✓";color:var(--accent)}
.progress{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar{height:100%;width:0;background:var(--accent);transition:width .25s}
.pmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:6px 0 18px}
h2{font:700 22px/1 "Barlow Condensed",Impact,sans-serif;margin:22px 0 8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.item.done{border-color:var(--done)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.name{font-weight:600}
.reps{color:var(--muted);font-size:14px;white-space:nowrap}
.note{color:var(--muted);font-size:14px;margin-top:2px}
.row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.set{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--muted);font:700 16px "Barlow Condensed",sans-serif;cursor:pointer}
.set[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.set:focus-visible,.tab:focus-visible,.reset:focus-visible,.w:focus-visible{outline:3px solid var(--done);outline-offset:2px}
.w{margin-left:auto;width:78px;border:1.5px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);padding:8px;font:500 15px Barlow,sans-serif;text-align:right}
.w::placeholder{color:var(--muted)}
.reset{margin-top:24px;width:100%;border:1.5px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:12px;font:600 15px Barlow,sans-serif;cursor:pointer}
.week{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.wtop{display:flex;justify-content:space-between;align-items:baseline}
.wtitle{font:700 22px/1 "Barlow Condensed",Impact,sans-serif}
.wgoal{color:var(--muted);font-size:14px}
.pips{display:flex;gap:8px;margin:12px 0}
.pip{flex:1;text-align:center;border:1.5px solid var(--line);border-radius:10px;padding:8px 0;font:600 13px Barlow,sans-serif;color:var(--muted)}
.pip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stats{display:flex;gap:20px;color:var(--muted);font-size:14px}
.stats b{display:block;color:var(--ink);font:700 24px/1.1 "Barlow Condensed",sans-serif}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.badge{border-radius:16px;padding:5px 10px;font:600 13px Barlow,sans-serif;border:1.5px dashed var(--line);color:var(--muted)}
.badge.on{border:1.5px solid var(--done);color:var(--ink)}
.recent{margin-top:10px;color:var(--muted);font-size:13px}
.modes{grid-template-columns:repeat(3,1fr);margin-bottom:16px}
.in{width:100%;border:1.5px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);padding:10px;font:500 15px Barlow,sans-serif}
.in::placeholder{color:var(--muted)}
.in:focus-visible,.fb:focus-visible,.fdel:focus-visible,.fnav:focus-visible,summary:focus-visible{outline:3px solid var(--done);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.lbl{display:block;color:var(--muted);font-size:13px;margin-bottom:3px}
.fnav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.fnav{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:700 20px sans-serif;cursor:pointer}
.fnav:disabled{opacity:.35;cursor:default}
.fdate{font:700 22px "Barlow Condensed",Impact,sans-serif}
.fb{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);padding:10px 0;font:500 16px Barlow,sans-serif;cursor:pointer}
.fb:first-child{border-top:0}
.fb small{display:block;color:var(--muted);font-size:13px}
.frow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow small{display:block;color:var(--muted);font-size:13px}
.fdel{border:0;background:none;color:var(--muted);font:600 14px Barlow,sans-serif;padding:8px;cursor:pointer;text-decoration:underline}
.cbtn{margin-top:10px;width:100%;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);padding:12px;font:700 16px Barlow,sans-serif;cursor:pointer}
summary{cursor:pointer;font-weight:600;padding:12px 0}

[hidden]{display:none!important}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin-bottom:8px}
.srow{padding:10px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow b{display:block;font-weight:600}
.srow span{color:var(--muted);font-size:14px}
.sintro{color:var(--muted);margin:0 0 4px}
.links{display:flex;gap:16px;margin-top:8px}
.links a{color:var(--done);font:600 14px Barlow,sans-serif;padding:6px 0}
.links a:focus-visible{outline:3px solid var(--done);outline-offset:2px}
.swapbtn{margin-top:8px;border:0;background:none;color:var(--done);font:600 14px Barlow,sans-serif;padding:6px 0;cursor:pointer;text-decoration:underline}
.alts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.alt{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:18px;padding:8px 12px;font:500 14px Barlow,sans-serif;cursor:pointer}
.alt.orig{border-style:dashed;color:var(--muted)}
.swapbtn:focus-visible,.alt:focus-visible{outline:3px solid var(--done);outline-offset:2px}
.finish{display:none;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:14px;margin-top:16px;font:700 20px "Barlow Condensed",sans-serif;text-align:center}
.finish.show{display:block}
.pin{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:8px 0 2px;margin-bottom:12px;box-shadow:0 8px 8px -8px rgba(0,0,0,.3)}
.pin .pmeta{margin:6px 0 6px}
.pin .wtop{margin-bottom:8px}
</style>
</head>
<body>
<main>
<h1>3-Day Workout</h1>
<div class="tabs modes" role="tablist"><button class="tab" role="tab" id="mTrain">Workouts</button><button class="tab" role="tab" id="mSnacks">Snacks</button><button class="tab" role="tab" id="mFood">Food log</button></div>
<div id="train">
<section class="week" id="week" aria-label="Weekly progress"></section>
<div class="tabs" role="tablist" id="tabs"></div>
<div class="pin"><div class="progress" aria-hidden="true"><div class="bar" id="bar"></div></div>
<div class="pmeta"><span id="count">0 of 0 done</span><span id="pct">0%</span></div></div>
<div id="list"></div>
<div class="finish" id="finish">Workout complete. Nice work!</div>
<button class="reset" id="reset">Reset this day</button>
</div>
<div id="snacks" hidden></div>
<div id="food" hidden></div>
</main>
<script>
var WARM={h:"Warm-up",items:[{n:"Easy bike or incline walk",r:"5 min",s:1,x:1},{n:"Bodyweight squats, arm circles, hip openers",r:"1–2 rounds",s:1,x:1}]};
function fl(list){return {h:"Flexibility",items:list.map(function(n){return {n:n,r:"30–45 sec",s:1}})}}
var DAYS=[
{id:"fullA",t:"Full A",d:"Mon",dow:1,sec:[WARM,{h:"Strength",lift:1,items:[
{n:"Barbell back squat",r:"6–8 reps",s:4,note:"Weeks 1–2: stop 3 reps short of failure, then add weight each week"},{n:"Barbell bench press",r:"6–8 reps",s:4,note:"Add 5 lb once you hit 8 reps on every set"},{n:"Barbell row",r:"8–10 reps",s:3},{n:"Romanian deadlift",r:"8 reps",s:3,note:"Hinge at the hips, back flat"},{n:"Dumbbell shoulder press",r:"8–10 reps",s:3},{n:"Hanging leg raise or cable crunch",r:"10–12 reps",s:3}]},
{h:"Cardio",items:[{n:"Incline treadmill walk",r:"25 min",s:1,note:"Steady pace, breathing hard but able to talk"}]},
fl(["Hamstring stretch","Hip flexor stretch","Pigeon pose"])]},
{id:"fullB",t:"Full B",d:"Wed",dow:3,sec:[WARM,{h:"Strength",lift:1,items:[
{n:"Leg press",r:"10–12 reps",s:4},{n:"Incline dumbbell press",r:"8–10 reps",s:3},{n:"Pull-ups or assisted pull-ups",r:"6–10 reps",s:4},{n:"Hip thrust",r:"8–10 reps",s:3},{n:"Lateral raise",r:"12–15 reps",s:3},{n:"Dumbbell curl",r:"10–12 reps",s:3},{n:"Dead bug or Pallof press",r:"10 per side",s:3}]},
{h:"Cardio",items:[{n:"Bike or rower intervals",r:"15 min",s:1,note:"30 sec hard, 90 sec easy"}]},
fl(["Thoracic spine rotations","Doorway chest stretch","World’s greatest stretch"])]},
{id:"fullC",t:"Full C",d:"Fri",dow:5,sec:[WARM,{h:"Strength",lift:1,items:[
{n:"Bulgarian split squat",r:"8 per leg",s:3},{n:"Dips or machine chest press",r:"8–12 reps",s:3},{n:"Chest-supported row",r:"10 reps",s:3},{n:"Leg curl",r:"10–12 reps",s:3},{n:"Face pulls",r:"15 reps",s:3},{n:"Triceps pushdown",r:"10–12 reps",s:3},{n:"Standing calf raise",r:"12–15 reps",s:3}]},
{h:"Cardio",items:[{n:"Elliptical or incline walk",r:"25 min",s:1}]},
fl(["World’s greatest stretch","Hamstring stretch","Doorway chest stretch"])]}
];
var G={
squat:["Barbell back squat","Front squat","Hack squat machine","Leg press","Smith machine squat","Goblet squat","Box squat"],
hinge:["Romanian deadlift","Trap bar deadlift","Conventional deadlift","Back extension","Cable pull-through","Good morning","Kettlebell swing"],
lunge:["Bulgarian split squat","Walking lunges","Reverse lunges","Step-ups","Split squat","Lateral lunges"],
core:["Hanging leg raise or cable crunch","Hanging leg raise","Cable crunch","Ab wheel rollout","Pallof press","Dead bug","Plank","Side plank","Bird dog"],
hpress:["Barbell bench press","Incline barbell press","Incline dumbbell press","Dumbbell bench press","Dips or machine chest press","Machine chest press","Smith machine bench press","Push-ups","Floor press"],
hrow:["Barbell row","Pendlay row","Seated cable row","Chest-supported row","T-bar row","One-arm dumbbell row","Machine row","Inverted row"],
vpress:["Barbell overhead press","Dumbbell shoulder press","Machine shoulder press","Arnold press","Landmine press"],
vpull:["Pull-ups or assisted pull-ups","Pull-ups","Assisted pull-ups","Lat pulldown","Neutral-grip pulldown","Straight-arm pulldown"],
tri:["Triceps pushdown","Overhead triceps extension","Skull crushers","Close-grip bench press","Dips","Bench dips","Close-grip push-ups"],
bi:["Dumbbell curl","Hammer curl","Cable curl","Incline dumbbell curl"],
thrust:["Hip thrust","Hip thrust machine","Glute bridge","Cable pull-through","Cable glute kickback"],
curl:["Leg curl","Seated leg curl","Stability ball hamstring curl","Slider leg curl"],
calf:["Standing calf raise","Seated calf raise","Single-leg calf raise","Leg press calf raise"],
lat:["Lateral raise","Cable lateral raise","Machine lateral raise","Seated dumbbell lateral raise"],
rear:["Face pulls","Reverse fly","Band pull-aparts","Rear-delt machine fly"],
cardio:["Incline treadmill walk","Bike","Rower","Elliptical","Stair climber","Swimming"]};
var MAP={"Goblet squat":"squat","Barbell back squat":"squat","Barbell bench press":"hpress","Barbell row":"hrow","Hanging leg raise or cable crunch":"core","Pull-ups or assisted pull-ups":"vpull","Bulgarian split squat":"lunge","Dips or machine chest press":"hpress","Romanian deadlift":"hinge","Walking lunges":"lunge","Leg press":"squat","Plank":"core","Dumbbell bench press":"hpress","Seated cable row":"hrow","Dumbbell shoulder press":"vpress","Lat pulldown":"vpull","Triceps pushdown":"tri","Dumbbell curl":"bi","Hip thrust":"thrust","Step-ups or split squats":"lunge","Leg curl":"curl","Standing calf raise":"calf","Dead bug or Pallof press":"core","Incline dumbbell press":"hpress","Chest-supported row":"hrow","Lateral raise":"lat","Face pulls":"rear","Push-ups":"hpress","Incline treadmill walk":"cardio","Bike or rower intervals":"cardio","Elliptical or incline walk":"cardio"};
var openSwap=null;
var KEY="workout-tracker-v1",state={checks:{},weights:{},swaps:{},mode:"train",food:{},custom:[],goals:{cal:2300,pro:190},hist:{},week:null,tab:null};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&typeof p==="object")state=Object.assign(state,p)}}catch(e){}
var GOAL=3;
function wkey(x){return x.getFullYear()+"-"+("0"+(x.getMonth()+1)).slice(-2)+"-"+("0"+x.getDate()).slice(-2)}
function prevKey(k){var q=k.split("-");return wkey(new Date(+q[0],+q[1]-1,+q[2]-7))}
var now=new Date(),mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7)),CUR=wkey(mon);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function dayById(id){return DAYS.filter(function(d){return d.id===id})[0]}
if(!state.swaps||typeof state.swaps!=="object")state.swaps={};
if(!state.hist||typeof state.hist!=="object")state.hist={};
if(state.week&&state.week!==CUR)state.checks={};
if(!state.food||typeof state.food!=="object")state.food={};
if(!Array.isArray(state.custom))state.custom=[];
if(!state.goals||!(state.goals.cal>0)||!(state.goals.pro>0))state.goals={cal:2300,pro:190};
if(["train","snacks","food"].indexOf(state.mode)<0)state.mode="train";
state.week=CUR;
if(!state.tab||!dayById(state.tab)){
  var dw=new Date().getDay(),pick=DAYS.filter(function(d){return d.dow>=dw})[0]||DAYS[0];state.tab=pick.id}
function total(day){var t=0;day.sec.forEach(function(s){s.items.forEach(function(i){t+=i.s})});return t}
function doneCount(day){var c=0;day.sec.forEach(function(s,si){s.items.forEach(function(i,ii){for(var k=0;k<i.s;k++)if(state.checks[day.id+"-"+si+"-"+ii+"-"+k])c++})});return c}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function updateHist(){
  var done=DAYS.filter(function(d){return doneCount(d)===total(d)}).map(function(d){return d.id}),sets=0;
  DAYS.forEach(function(d){sets+=doneCount(d)});state.hist[CUR]={done:done,sets:sets};save()}
function streak(){
  var h=state.hist,k=CUR,n=0;if(h[k]&&h[k].done.length>=GOAL)n++;
  k=prevKey(k);while(h[k]&&h[k].done.length>=GOAL){n++;k=prevKey(k)}return n}
function bestStreak(){
  var keys=Object.keys(state.hist).sort(),best=0,run=0,last=null;
  keys.forEach(function(k){
    if(state.hist[k].done.length>=GOAL){run=(last&&prevKey(k)===last)?run+1:1;last=k;if(run>best)best=run}else{run=0;last=null}});
  return best}
function renderWeek(){
  var box=document.getElementById("week");box.innerHTML="";
  var h=state.hist,cur=h[CUR]||{done:[],sets:0},tw=0,ts=0,perfect=0;
  Object.keys(h).forEach(function(k){tw+=h[k].done.length;ts+=h[k].sets;if(h[k].done.length>=GOAL)perfect++});
  var top=el("div","wtop");top.appendChild(el("span","wtitle","This week"));
  top.appendChild(el("span","wgoal",cur.done.length>=GOAL?"Goal hit":cur.done.length+" of "+GOAL+" workouts"));box.appendChild(top);
  var pips=el("div","pips");
  DAYS.forEach(function(d){pips.appendChild(el("div","pip"+(cur.done.indexOf(d.id)>-1?" on":""),(cur.done.indexOf(d.id)>-1?"✓ ":"")+d.t))});box.appendChild(pips);
  var st=el("div","stats"),s1=el("div"),s2=el("div"),s3=el("div");
  s1.appendChild(el("b",null,String(cur.sets)));s1.appendChild(document.createTextNode("sets this week"));
  s2.appendChild(el("b",null,String(streak())));s2.appendChild(document.createTextNode("week streak"));
  s3.appendChild(el("b",null,String(tw)));s3.appendChild(document.createTextNode("workouts total"));
  st.appendChild(s1);st.appendChild(s2);st.appendChild(s3);box.appendChild(st);
  var best=bestStreak(),bd=[["First workout",tw>=1],["Goal week",perfect>=1],["3-week streak",best>=3],["100 sets",ts>=100],["25 workouts",tw>=25]];
  var bw=el("div","badges");bd.forEach(function(b){bw.appendChild(el("span","badge"+(b[1]?" on":""),(b[1]?"✓ ":"")+b[0]))});box.appendChild(bw);
  var parts=[],k=prevKey(CUR);
  for(var i=0;i<4;i++){if(h[k]){var q=k.split("-");parts.push(new Date(+q[0],+q[1]-1,+q[2]).toLocaleDateString(undefined,{month:"short",day:"numeric"})+": "+h[k].done.length+"/"+GOAL)}k=prevKey(k)}
  if(parts.length)box.appendChild(el("div","recent","Past weeks — "+parts.join("  ")))}
function render(){
  updateHist();
  var day=dayById(state.tab),tabs=document.getElementById("tabs");tabs.innerHTML="";
  DAYS.forEach(function(d){
    var b=el("button","tab"+(doneCount(d)===total(d)?" complete":""));b.setAttribute("role","tab");b.setAttribute("aria-selected",d.id===state.tab);
    b.appendChild(document.createTextNode(d.t));b.appendChild(el("small",null,d.d));
    b.onclick=function(){state.tab=d.id;save();render()};tabs.appendChild(b)});
  var list=document.getElementById("list");list.innerHTML="";
  day.sec.forEach(function(sec,si){
    list.appendChild(el("h2",null,sec.h));
    sec.items.forEach(function(it,ii){
      var ikey=day.id+"-"+si+"-"+ii,nm=state.swaps[ikey]||it.n,card=el("div","item"),top=el("div","top");
      top.appendChild(el("span","name",nm));top.appendChild(el("span","reps",(it.s>1?it.s+" × ":"")+it.r));card.appendChild(top);
      if(it.note&&!state.swaps[ikey])card.appendChild(el("div","note",it.note));
      var row=el("div","row"),n=0;
      for(var k=0;k<it.s;k++){(function(k){
        var id=day.id+"-"+si+"-"+ii+"-"+k,on=!!state.checks[id];if(on)n++;
        var b=el("button","set",it.s>1?String(k+1):"✓");b.setAttribute("aria-pressed",on);
        b.setAttribute("aria-label",nm+(it.s>1?", set "+(k+1):""));
        b.onclick=function(){if(state.checks[id])delete state.checks[id];else state.checks[id]=1;save();render()};row.appendChild(b)})(k)}
      if(sec.lift){var w=el("input","w");w.type="text";w.inputMode="decimal";w.placeholder="lbs";w.setAttribute("aria-label","Weight for "+nm);
        w.value=state.weights[nm]||"";w.oninput=function(){state.weights[nm]=w.value;save()};row.appendChild(w)}
      if(n===it.s)card.classList.add("done");card.appendChild(row);
      if(!it.x){
        var q=encodeURIComponent(nm),lk=el("div","links");
        var v=el("a",null,"Watch video");v.href="https://www.youtube.com/results?search_query="+q+"%20proper%20form%20tutorial";
        var im=el("a",null,"See photos");im.href="https://www.google.com/search?tbm=isch&q="+q+"%20exercise%20form";
        [v,im].forEach(function(a){a.target="_blank";a.rel="noopener noreferrer";lk.appendChild(a)});card.appendChild(lk)}
      var grp=MAP[it.n];
      if(grp){
        var sb=el("button","swapbtn",openSwap===ikey?"Close":"Swap exercise");sb.setAttribute("aria-expanded",openSwap===ikey);
        sb.onclick=function(){openSwap=openSwap===ikey?null:ikey;render()};card.appendChild(sb);
        if(openSwap===ikey){
          var box=el("div","alts"),opts=G[grp].filter(function(a){return a!==nm&&a!==it.n});
          if(nm!==it.n)opts.unshift(it.n);
          opts.forEach(function(a){
            var ab=el("button","alt"+(a===it.n?" orig":""),a===it.n?"Original: "+a:a);
            ab.onclick=function(){
              if(a===it.n)delete state.swaps[ikey];else state.swaps[ikey]=a;
              Object.keys(state.checks).forEach(function(k){if(k.indexOf(ikey+"-")===0)delete state.checks[k]});
